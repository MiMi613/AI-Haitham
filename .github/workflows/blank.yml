name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: cd "AI-Haitham API simple" && mvn compile && ls target/classes/HaithamPrompt.txt


      - name: Run with Maven
        run: cd "AI-Haitham API simple" && mvn exec:java -Dexec.mainClass="Main.java"   # e.g. "com.example.Main"
