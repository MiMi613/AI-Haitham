name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'   # e.g. 17, 21, 11 — run `java -version` to check
          distribution: 'temurin'

      - name: Checkout repository with submodules
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Build Maven module
        working-directory: 'AI-Haitham API simple'
        run: mvn clean install

      - name: Build with Maven
        run: cd "AI-Haitham API simple" && mvn compile

      - name: Run with Maven
        run: cd "AI-Haitham API simple" && mvn exec:java -Dexec.mainClass="Main.java"   # e.g. "com.example.Main"
